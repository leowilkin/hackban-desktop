name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    # Xcode 26+ (macOS 26 SDK), or the app gets no Liquid Glass.
    runs-on: macos-26
    permissions:
      contents: write # to publish releases, which the app's updater installs
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test HackbanKit
        run: swift test
      # Every build signed with the same self-signed certificate, so the keychain doesn't ask again after each update
      # (see "Signing" in the README). It goes into a throwaway keychain that only bundle.sh's codesign reads.
      # Without the secrets (forks, or before they're set up) the build is signed ad hoc.
      - name: Signing certificate
        env:
          P12: ${{ secrets.HACKBAN_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.HACKBAN_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "::warning::No HACKBAN_SIGNING_P12 secret, so this build is signed ad hoc."; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=Hackban Release" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Build Hackban.app
        run: ./Scripts/bundle.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Zip
        run: cd build && ditto -c -k --keepParent Hackban.app Hackban.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hackban
          path: build/Hackban.zip
      # The updater only installs zips signed with the key whose public half is in the app's Info.plist. The
      # secret only reaches this step, and the script fails if it's missing or doesn't match that public key.
      - name: Sign release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HACKBAN_UPDATE_KEY: ${{ secrets.HACKBAN_UPDATE_KEY }}
        run: |
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :HackbanUpdatePublicKey' build/Hackban.app/Contents/Info.plist)"
          ./Scripts/update-key.swift sign build/Hackban.zip "$public_key"
      # Artifacts need a signed-in download, so main's builds also go out as releases (build-<run number>).
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          tag="build-$BUILD_NUMBER"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          gh release create "$tag" build/Hackban.zip build/Hackban.zip.sig --target "$GITHUB_SHA" \
            --title "Build $BUILD_NUMBER" --notes "$(git log -1 --format=%s)"

  linux-kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Test HackbanKit
        run: swift test
