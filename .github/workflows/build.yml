name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test HackbanKit
        run: swift test
      - name: Build Hackban.app
        run: ./Scripts/bundle.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Hackban.app Hackban.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hackban
          path: build/Hackban.zip

  linux-kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Test HackbanKit
        run: swift test
